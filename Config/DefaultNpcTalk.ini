; Push-to-talk NPC conversations (Source/SpaceSurvival/Public/SSNpcTalk.h, docs/NPC_TALK.md).
; Both servers are local sidecars the game starts hidden and stops on exit. These paths are the owner's machine
; (M:\Local AI\NPCTalk); a packaged build will carry the binaries and models beside the executable instead.
[/Script/SpaceSurvival.SSNpcTalkSubsystem]
bEnabled=True
WhisperServerExe=M:/Local AI/NPCTalk/bin/whisper/Release/whisper-server.exe
WhisperModel=M:/Local AI/NPCTalk/models/ggml-small.en.bin
LlamaServerExe=M:/Local AI/NPCTalk/bin/llama/llama-server.exe
; The Director's model during waves. Owner 2026-10-10: Gemma-3-4b-it-MAX-HORROR (DavidAU, uncensored, 3.5 GB) -
; "deep articulate hatred" over swearing, "I'll take a poetic villain". Previously Huihui-Qwen3.5-4B-abliterated.
LlamaModel=M:/Local AI/NPCTalk/models/candidates/Gemma-3-4b-it-MAX-HORROR-Uncensored-D_AU-Q4_K_M-imat.gguf
LlamaExtraArgs=--reasoning off
PersonaDirectory=SpaceSurvival/NpcTalk/Personas
WhisperPort=8701
LlamaPort=8702
LlamaGpuLayers=99
MaxReplyTokens=120
HistoryTurns=8
Temperature=0.7
; llama-server defaults to 1.0; the Llama roleplay cards want 1.05 or the reply ends in a repeated paragraph.
RepeatPenalty=1.05
Threads=8
; Station model (owner 2026-10-10: "load the better model at space stations and initiating wave kills the server").
; Loaded when the walker steps onto the deck, unloaded on departure; the flight model above serves the villain in
; a wave. Empty or missing: the flight model serves the station too. Daredevil-8B-abliterated: the 2026-10-10 panel's
; pick over 20 models (all four crew roles 7-8/10, shippable Llama 3 licence); Hermes-3 8B was the runner-up.
StationLlamaModel=M:/Local AI/NPCTalk/models/candidates/Daredevil-8B-abliterated-NEO-V1-D_AU-Q4_K_M-imat13.gguf
StationLlamaExtraArgs=
