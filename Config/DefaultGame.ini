# RPT-20260916-18: only the two data assets SSHUD actually reads (keyboard/mouse, Xbox gamepad).
# Their hard texture references cook automatically with them; the vendor demo level/character and
# the unused PlayStation/Switch icon sets are deliberately left out of the package.
+DirectoriesToAlwaysCook=(Path="/Game/EasyInputPrompts/Datas/IconsData")
# What the game loads by name. A string is not a reference, so the cooker never follows it: the hull
# is fetched with LoadObject on FSSHullDefinition::MeshPath, and without a line here a package
# contains no Phoenix at all. Installed() is a DoesPackageExist check, so it answers false and the
# build ships the OLD hull with no error, no log line and a green test suite.
#
# FOLDERS, NOT ROOTS - the same shape as the Asteroid_Library and SciFiCorridor entries above, and
# for a reason that cost a failed cook to learn. Naming a whole vendor root drags in that pack's demo
# content, and demo content is built against a project that is not this one: cooking /Game/NERVES
# pulled in a MovieRenderQueue asset needing the MovieRenderPipeline plugin, /Game/Robot_scout_R_21
# pulled in a BP_ThirdPersonCharacter with a VR node that no longer exists, and /Game/Stellar_Phoenix
# pulled in BP_Spaceship, which does not compile here - it spawns a class it was not given and wires
# a Player pin to an Occupant of a different type. Seventeen cook errors, none of them ours.
#
# So each line below covers exactly the folder something in Source actually names, and nothing else.
# Scripts/CheckCookCoverage.py proves the set is complete; widening one of these to its root is how
# that failed cook comes back.
#
#   Stellar_Phoenix    : the ship, its clips, its effects and their materials.
#   Defect             : the station's seven static props.
#   Robot_scout_R_21   : one station staff member, mesh and idle.
#   Heavy_space_trooper: the other, mesh and idle.
#   SciFITrooper_Man_03: a selectable hero declared in FSSHeroDefinition.
#   NERVES             : the electrical-storm beams, which the hazard and distant weather share.
#   Megastructure      : the alien gallery's two levels, reachable as ESSPanel::AlienGallery.
#
# The owner confirmed on 2026-09-19 that every pack here is licensed.
+DirectoriesToAlwaysCook=(Path="/Game/Stellar_Phoenix/Spaceship/Meshes")
+DirectoriesToAlwaysCook=(Path="/Game/Stellar_Phoenix/Spaceship/Animation")
+DirectoriesToAlwaysCook=(Path="/Game/Stellar_Phoenix/Spaceship/VFX")
+DirectoriesToAlwaysCook=(Path="/Game/Defect/StaticMeshes/Props")
+DirectoriesToAlwaysCook=(Path="/Game/Robot_scout_R_21/Mesh")
+DirectoriesToAlwaysCook=(Path="/Game/Robot_scout_R_21/Demo/Animations")
+DirectoriesToAlwaysCook=(Path="/Game/Heavy_space_trooper/character/mesh")
+DirectoriesToAlwaysCook=(Path="/Game/Heavy_space_trooper/Demo/animations")
+DirectoriesToAlwaysCook=(Path="/Game/SciFITrooper_Man_03/SkeletalMesh")
+DirectoriesToAlwaysCook=(Path="/Game/SciFITrooper_Man_03/DemoContent/Anims")
+DirectoriesToAlwaysCook=(Path="/Game/NERVES/FX")
+DirectoriesToAlwaysCook=(Path="/Game/Megastructure_Scifi_World/Level")
# The station's alien crew. SKM_Nyxar is fetched with LoadObject in SSStationPresentation::BuildAlienCrew,
# so without these three lines a package contains the station and no crew - the same silent shape as the
# Phoenix. FOLDERS again, not the root: /Game/Nyxar/Demo and /Game/Nyxar/Blueprints hold the pack's own
# third-person character, its input actions and its demo map, none of which this project defines or wants.
# The retargeted clips and the recoloured crew materials already cook, because they were authored into
# /Game/SpaceSurvival/Licensed/StationAssets/AlienCrew by Scripts/AuthorAlienCrew.py.
+DirectoriesToAlwaysCook=(Path="/Game/Nyxar/Meshes")
+DirectoriesToAlwaysCook=(Path="/Game/Nyxar/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/Nyxar/TXT")
# The selectable soldier. Same rule as every line above: SSWalker fetches the mesh and its clips with
# LoadObject on FSSHeroDefinition paths, so without these the wardrobe would list a body that is not
# in the package. Folders, not the root - /Game/RetroFuturisticSoldier/DemoAssets and /Maps hold the
# pack's own third-person character, its input actions and its demo level, none of which this project
# defines or wants.
+DirectoriesToAlwaysCook=(Path="/Game/RetroFuturisticSoldier/Meshes")
+DirectoriesToAlwaysCook=(Path="/Game/RetroFuturisticSoldier/Anims")
+DirectoriesToAlwaysCook=(Path="/Game/RetroFuturisticSoldier/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/RetroFuturisticSoldier/Textures")
# The retarget source for the squirrel's MoCap-derived clips: the MoCap Online mannequin, its
# skeleton, the eight raw pack clips, the two IK Rigs and the retargeter, plus the retargeted clips
# nothing references. It sits inside /Game/SpaceSurvival because that is where licensed derivatives
# belong, and /Game/SpaceSurvival is always cooked - so without this line 8.6 MB of RAW PACK FILES
# would enter every package. THIRD_PARTY.md says in the project's own words that these credits "do
# not grant redistribution rights to raw asset files", and a cook is a redistribution. Nothing in
# the game references any of it: the shipped clips are derivatives beside the hero, the rigs and the
# retargeter are editor-only, and Scripts/AuthorHeroMocapRetarget.py rebuilds the lot from the
# purchased download.
+DirectoriesToNeverCook=(Path="/Game/SpaceSurvival/Licensed/MocapSource")
