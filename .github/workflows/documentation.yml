name: Documentation review
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    container: python:3.12-slim-bookworm
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Test documentation review gate
        run: python Tests/TestPrDocumentation.py
      - name: Check PR review declarations
        run: python Scripts/CheckPrDocumentation.py --repo . --event "$GITHUB_EVENT_PATH"